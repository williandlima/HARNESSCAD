<div id="app">
  <nav id="menubar"><span class="brand">⚡ HarnessCAD</span><div id="menus" style="display:flex"></div><span class="title" id="docTitle"></span></nav>
  <div id="toolbar"></div>
  <main id="layout">
    <aside id="left">
      <div class="tabs" id="leftTabs">
        <button data-p="pConn" class="on">Conectores</button><button data-p="pWire">Fios</button><button data-p="pSplice">Emendas</button>
      </div>
      <div class="pane" id="pConn"></div>
      <div class="pane" id="pWire" style="display:none"></div>
      <div class="pane" id="pSplice" style="display:none"></div>
    </aside>
    <div class="vsplit" id="splitL" title="Arraste para redimensionar · duplo clique recolhe"></div>
    <section id="center">
      <div id="canvasWrap"><canvas id="cv" tabindex="0"></canvas></div>
      <div id="sheetTabs"></div>
    </section>
    <div class="vsplit" id="splitR" title="Arraste para redimensionar · duplo clique recolhe"></div>
    <aside id="right">
      <div class="tabs"><button class="on">Propriedades</button></div>
      <div class="pane" id="props"></div>
    </aside>
  </main>
  <div class="hsplit" id="splitB" title="Arraste para redimensionar · duplo clique recolhe"></div>
  <section id="dock">
    <div class="tabs" id="dockTabs"></div>
    <div id="dockBody"></div>
  </section>
  <footer id="status"></footer>
</div>
<div id="modal"></div>
